<title>Steffy &amp; Gaurish Launch List</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,400&family=Karla:wght@300;400;500;700&display=swap">
<style id="css">
  :root{
    --ground:#F7F2F5;
    --surface:#FDFAFB;
    --ink:#3A2B3A;
    --ink-soft:#786376;
    --accent:#B2405A;
    --rose:#B26076;
    --gilt:#C3A36E;
    --sage:#7E9477;
    --rule:rgba(122,99,118,0.20);
    --rule-strong:rgba(122,99,118,0.34);
    --done-bg:rgba(126,148,119,0.10);
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --ground:#191220;
      --surface:#221929;
      --ink:#F0E3EA;
      --ink-soft:#BFA7B7;
      --accent:#E8899E;
      --rose:#E39BAE;
      --gilt:#CBA971;
      --sage:#9DB295;
      --rule:rgba(203,169,113,0.20);
      --rule-strong:rgba(203,169,113,0.34);
      --done-bg:rgba(157,178,149,0.10);
    }
  }
  :root[data-theme="dark"]{
    --ground:#191220;
    --surface:#221929;
    --ink:#F0E3EA;
    --ink-soft:#BFA7B7;
    --accent:#E8899E;
    --rose:#E39BAE;
    --gilt:#CBA971;
    --sage:#9DB295;
    --rule:rgba(203,169,113,0.20);
    --rule-strong:rgba(203,169,113,0.34);
    --done-bg:rgba(157,178,149,0.10);
  }

  *{box-sizing:border-box}
  body{
    margin:0;background:var(--ground);color:var(--ink);
    font-family:"Karla",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased;
  }
  .page{max-width:53rem;margin:0 auto;padding-block:clamp(2rem,6vw,3.5rem);padding-left:clamp(16px,4vw,2rem);padding-right:clamp(16px,4vw,2rem)}

  .eyebrow{
    font-size:.66rem;letter-spacing:.24em;text-transform:uppercase;
    color:var(--gilt);font-weight:500;margin:0 0 .5rem;
  }
  h1{
    font-family:"Cormorant Garamond",Georgia,serif;font-weight:300;
    font-size:clamp(2.2rem,6.5vw,3.2rem);line-height:1.08;margin:0;
    text-wrap:balance;letter-spacing:.01em;
  }
  .sub{color:var(--ink-soft);margin:.6rem 0 0;max-width:46ch}

  /* progress ---------------------------------------------------------- */
  .meter{
    margin-top:2rem;padding:1.35rem 1.4rem;background:var(--surface);
    border:1px solid var(--rule);border-radius:10px;
    display:flex;flex-wrap:wrap;align-items:center;gap:1.5rem 2.2rem;
  }
  .stat{display:flex;flex-direction:column;gap:.15rem}
  .stat b{
    font-family:"Cormorant Garamond",Georgia,serif;font-weight:400;
    font-size:1.9rem;line-height:1;font-variant-numeric:tabular-nums;
  }
  .stat span{font-size:.62rem;letter-spacing:.17em;text-transform:uppercase;color:var(--ink-soft)}
  .stat.warn b{color:var(--accent)}
  .bar{flex:1 1 11rem;min-width:9rem}
  .bar-track{height:5px;border-radius:3px;background:var(--rule);overflow:hidden}
  .bar-fill{height:100%;background:var(--sage);border-radius:3px;transition:width .3s ease}
  .bar-label{font-size:.62rem;letter-spacing:.17em;text-transform:uppercase;color:var(--ink-soft);margin-top:.5rem}

  .note{
    margin-top:1rem;font-size:.84rem;color:var(--ink-soft);
    display:flex;gap:.5rem;align-items:baseline;
  }
  .note.hide{display:none}

  /* groups ------------------------------------------------------------ */
  .group{margin-top:2.6rem}
  .group-head{display:flex;align-items:baseline;gap:.75rem;padding-bottom:.6rem;border-bottom:1px solid var(--rule-strong)}
  .group-head h2{
    font-family:"Cormorant Garamond",Georgia,serif;font-weight:400;
    font-size:1.5rem;margin:0;letter-spacing:.01em;
  }
  .group-head .count{
    font-size:.62rem;letter-spacing:.14em;text-transform:uppercase;
    color:var(--ink-soft);font-variant-numeric:tabular-nums;margin-left:auto;
  }
  .group-why{font-size:.84rem;color:var(--ink-soft);margin:.6rem 0 0}

  ul.items{list-style:none;margin:.4rem 0 0;padding:0}
  li.item{
    display:grid;grid-template-columns:auto 1fr;gap:.2rem .85rem;
    padding:.95rem 0 .95rem .9rem;border-bottom:1px solid var(--rule);
    border-left:2px solid transparent;transition:border-color .2s ease,opacity .2s ease;
  }
  li.item:last-child{border-bottom:0}
  li.item.blocking{border-left-color:var(--accent)}
  li.item.done{opacity:.5}
  li.item.done .title{text-decoration:line-through;text-decoration-color:var(--rule-strong)}

  .box{
    grid-row:1/3;appearance:none;-webkit-appearance:none;margin:.28rem 0 0;
    width:18px;height:18px;border:1px solid var(--rule-strong);border-radius:3px;
    background:var(--surface);cursor:pointer;display:grid;place-content:center;flex:none;
  }
  .box::after{
    content:"";width:10px;height:6px;border-left:2px solid var(--sage);
    border-bottom:2px solid var(--sage);transform:rotate(-45deg) scale(0);
    transition:transform .14s ease;
  }
  .box:checked{background:var(--done-bg);border-color:var(--sage)}
  .box:checked::after{transform:rotate(-45deg) scale(1)}
  .box:focus-visible{outline:2px solid var(--rose);outline-offset:2px}
  .box:disabled{cursor:default;opacity:.55}

  .title{font-weight:500;cursor:pointer;margin:0}
  .detail{font-size:.87rem;color:var(--ink-soft);margin:.15rem 0 0;grid-column:2}
  .detail code{
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.85em;
    background:var(--done-bg);padding:.1em .35em;border-radius:3px;
    overflow-wrap:anywhere;
  }

  footer{
    margin-top:3rem;padding-top:1.4rem;border-top:1px solid var(--rule);
    font-size:.8rem;color:var(--ink-soft);display:flex;flex-wrap:wrap;gap:.4rem 1.2rem;
  }
  footer a{color:var(--rose)}

  @media (prefers-reduced-motion:reduce){
    *{transition-duration:.01ms!important}
  }
  @media (max-width:430px){
    .meter{gap:1.1rem 1.6rem;padding:1.15rem}
    .stat b{font-size:1.6rem}
  }
</style>

<div class="page" id="app"></div>

<script id="state" type="application/json">{"checked":{}}</script>
<script id="app-src">
(function(){
  "use strict";

  var GROUPS = [
    {
      id:"blocking", title:"Blocks the launch",
      why:"Nothing else matters until these are done — each one either breaks a guest's next step or keeps the site invisible.",
      blocking:true,
      items:[
        {id:"rsvp-link", t:"Wire up the RSVP form",
         d:"The button still points at <code>https://forms.gle/your-form-link</code>, a placeholder. It isn't flagged as a placeholder anywhere, so it never showed in the counts — and it's the one thing every guest will click. Build the form, then send me the real link."},
        {id:"share", t:"Share the site",
         d:"It's private. Only you can open that link today. Use <b>Share</b> at the top right of the artifact before sending it anywhere."},
        {id:"registry", t:"Add the three registry links",
         d:"Honeymoon fund, home registry and charity all point at <code>#</code>. They look live and do nothing."},
        {id:"shuttle", t:"Resolve the shuttle contradiction",
         d:"The RSVP note says the form asks “whether you need the shuttle” — the only mention of a shuttle on the site, while Travel &amp; stay tells people to use rideshares. Add one, or drop the clause."},
        {id:"rsvp-date", t:"Confirm the reply-by date",
         d:"Currently <b>Friday, October 2, 2026</b> — my suggestion, not your decision. Guests will plan around it."}
      ]
    },
    {
      id:"details", title:"Details guests will look for",
      why:"The site works without these, but someone will go hunting and come up empty.",
      items:[
        {id:"doors", t:"Set the doors time",
         d:"Shows as <b>[3:30 pm]</b> in The details. The 4:00 ceremony is confirmed."},
        {id:"contact", t:"Name a day-of contact",
         d:"A name and number for someone who <b>isn't</b> the two of you — you'll be otherwise engaged."},
        {id:"photos", t:"Fill the last three photo slots",
         d:"Three illustrated plates are still standing in: the wide feature, “With the people standing up with us”, and “A black &amp; white portrait”."},
        {id:"photos-note", t:"Drop the “send more images” line",
         d:"The Photos intro still invites more pictures. Remove it once the gallery is finished."}
      ]
    },
    {
      id:"cover", title:"The cover page",
      why:"All visual, and none of it verified — I've never seen the cover rendered. Open it on a phone and judge these together.",
      items:[
        {id:"cover-phone", t:"Open the cover on a phone",
         d:"Everything below is easier to judge in one pass, at the size most guests will use."},
        {id:"pinyon", t:"Decide on Pinyon Script",
         d:"After the engraved redesign it survives in exactly two places — the “and” between your names in the hero, and the footer ampersand. Either a deliberate accent or a leftover. Dropping it removes a font download."},
        {id:"corners", t:"Check the corner orientation",
         d:"One drawing mirrored into all four corners; the stem base sits bottom-left. A flip is one line if it reads wrong."},
        {id:"corners-dark", t:"Check the corners in dark mode",
         d:"They use a different technique there — inverted and screened rather than multiplied — so it's the part most likely to look off."},
        {id:"motif", t:"Settle rings against swans",
         d:"Rings on the cover, swans in the hero directly behind it and in four other places. Deliberate contrast or an inconsistency — your call, not mine."}
      ]
    },
    {
      id:"tidy", title:"Housekeeping",
      why:"No guest will ever notice these. Worth closing anyway.",
      items:[
        {id:"old-repo", t:"Delete the old repo",
         d:"<code>steffytha/VSCode</code> still exists with the same history, superseded by <code>steffytha/wedding</code>. Safe to remove once you're happy."},
        {id:"trousers", t:"“Dress trousers” → “dress pants”",
         d:"Optional. Correct either way, but trousers reads British next to the US spellings everywhere else."}
      ]
    }
  ];

  var WEDDING = "2026-11-21T16:00:00";

  var stateEl = document.getElementById("state");
  var state;
  try { state = JSON.parse(stateEl.textContent) || {}; } catch(e){ state = {}; }
  if (!state.checked || typeof state.checked !== "object") state.checked = {};

  // per-viewer fallback, so ticks survive even when publishing is not available
  var LS = "sg-launch-list";
  try {
    var local = JSON.parse(localStorage.getItem(LS) || "null");
    if (local && typeof local === "object") {
      for (var k in local) if (local[k] && !(k in state.checked)) state.checked[k] = true;
    }
  } catch(e){}

  var artifact = null, readOnly = false, timer = null;

  function allItems(){
    var out = [];
    GROUPS.forEach(function(g){ g.items.forEach(function(i){ out.push({g:g, i:i}); }); });
    return out;
  }
  function daysToGo(){
    var ms = new Date(WEDDING) - new Date();
    return Math.max(0, Math.ceil(ms / 86400000));
  }
  function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;"); }

  function render(){
    var all = allItems();
    var total = all.length;
    var done = all.filter(function(x){ return state.checked[x.i.id]; }).length;
    var blockLeft = all.filter(function(x){ return x.g.blocking && !state.checked[x.i.id]; }).length;
    var pct = total ? Math.round(done / total * 100) : 0;

    var h = '';
    h += '<p class="eyebrow">Steffy &amp; Gaurish · November 21, 2026</p>';
    h += '<h1>What’s left on the wedding site</h1>';
    h += '<p class="sub">Everything still open on the invitation, ordered by what it costs you to leave undone. Tick an item and the page saves itself for both of you.</p>';

    h += '<div class="meter">';
    h +=   '<div class="stat"><b>' + done + '/' + total + '</b><span>Done</span></div>';
    h +=   '<div class="stat ' + (blockLeft ? 'warn' : '') + '"><b>' + blockLeft + '</b><span>Blocking launch</span></div>';
    h +=   '<div class="stat"><b>' + daysToGo() + '</b><span>Days to go</span></div>';
    h +=   '<div class="bar"><div class="bar-track"><div class="bar-fill" style="width:' + pct + '%"></div></div>';
    h +=   '<div class="bar-label">' + pct + '% complete</div></div>';
    h += '</div>';

    h += '<p class="note' + (readOnly ? '' : ' hide') + '" id="ro-note"><span>⚠</span><span>Read-only view — your ticks are kept in this browser only, not saved for anyone else.</span></p>';

    GROUPS.forEach(function(g){
      var gDone = g.items.filter(function(i){ return state.checked[i.id]; }).length;
      h += '<section class="group">';
      h +=   '<div class="group-head"><h2>' + g.title + '</h2>';
      h +=   '<span class="count">' + gDone + ' of ' + g.items.length + '</span></div>';
      h +=   '<p class="group-why">' + g.why + '</p>';
      h +=   '<ul class="items">';
      g.items.forEach(function(i){
        var on = !!state.checked[i.id];
        h += '<li class="item' + (g.blocking ? ' blocking' : '') + (on ? ' done' : '') + '">';
        h +=   '<input class="box" type="checkbox" id="cb-' + esc(i.id) + '" data-id="' + esc(i.id) + '"' +
               (on ? ' checked' : '') + (readOnly ? '' : '') + '>';
        h +=   '<label class="title" for="cb-' + esc(i.id) + '">' + i.t + '</label>';
        h +=   '<p class="detail">' + i.d + '</p>';
        h += '</li>';
      });
      h +=   '</ul>';
      h += '</section>';
    });

    h += '<footer><span>The invitation and this list are both in <a href="https://github.com/steffytha/wedding">steffytha/wedding</a>.</span>';
    h += '<span>Peninsula Prime · Cornelius, North Carolina</span></footer>';

    document.getElementById("app").innerHTML = h;
  }

  function buildDoc(s){
    var css = document.getElementById("css").textContent;
    var src = document.getElementById("app-src").textContent;
    var close = "<\/script>";
    return '<!doctype html><html><head><meta charset="utf-8">' +
      '<meta name="viewport" content="width=device-width,initial-scale=1">' +
      '<title>Steffy &amp; Gaurish Launch List<\/title>' +
      '<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,400&family=Karla:wght@300;400;500;700&display=swap">' +
      '<style id="css">' + css + '<\/style></head><body>' +
      '<div class="page" id="app"></div>' +
      '<script id="state" type="application/json">' + JSON.stringify(s) + close +
      '<script id="app-src">' + src + close +
      '</body></html>';
  }

  function save(){
    try { localStorage.setItem(LS, JSON.stringify(state.checked)); } catch(e){}
    if (!artifact || readOnly) return;
    clearTimeout(timer);
    timer = setTimeout(function(){
      artifact.publish(buildDoc(state)).catch(function(err){
        var code = err && err.code;
        if (code === "not_writer" || code === "not_granted" || code === "forbidden") {
          readOnly = true;
          var n = document.getElementById("ro-note");
          if (n) n.classList.remove("hide");
        }
        // `conflict` needs no handling: this view reloads to the winner.
      });
    }, 900);
  }

  document.getElementById("app").addEventListener("change", function(e){
    var box = e.target.closest(".box");
    if (!box) return;
    var id = box.getAttribute("data-id");
    if (box.checked) state.checked[id] = true; else delete state.checked[id];
    render();
    save();
  });

  render();

  if (window.claude && window.claude.use) {
    window.claude.use("artifact").then(function(a){ artifact = a; }).catch(function(){});
  }
})();
</script>
